<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" aria-labelledby="apTitle apDesc">
  <title id="apTitle">Architecture d’Artisan Pro</title>
  <desc id="apDesc">Interface React et Vite, API NestJS avec authentification et rôles, Prisma et PostgreSQL, modules métier.</desc>
  <defs>
    <linearGradient id="apBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="840" height="520" rx="24" fill="url(#apBg)"/>
  <text x="40" y="48" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" letter-spacing="2.2">SCHÉMA D’ARCHITECTURE</text>
  <text x="40" y="78" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700">Artisan Pro</text>
  <text x="40" y="102" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="13">Application métier pour atelier alimentaire — démo sur demande</text>

  <!-- Interface -->
  <rect x="40" y="140" width="760" height="72" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="420" y="172" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="650">Interface React / Vite</text>
  <text x="420" y="194" text-anchor="middle" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="12">Écrans branchés un à un sur l’API typée</text>

  <!-- Arrow -->
  <path d="M420 212 v28" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M414 234 l6 10 6-10" fill="#38bdf8"/>

  <!-- API -->
  <rect x="40" y="248" width="760" height="88" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="420" y="280" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="650">API NestJS</text>
  <text x="420" y="304" text-anchor="middle" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="12">Jeton signé · mots de passe scrypt · droits par rôle côté serveur</text>
  <text x="420" y="322" text-anchor="middle" fill="#64748b" font-family="Inter, Segoe UI, sans-serif" font-size="11">Tests E2E Jest · Docker</text>

  <path d="M420 336 v28" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M414 358 l6 10 6-10" fill="#38bdf8"/>

  <!-- Data -->
  <rect x="150" y="372" width="250" height="64" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="275" y="398" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="650">Prisma</text>
  <text x="275" y="418" text-anchor="middle" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="11">Modèles typés</text>
  <rect x="440" y="372" width="250" height="64" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="565" y="398" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="650">PostgreSQL</text>
  <text x="565" y="418" text-anchor="middle" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="11">Données métier</text>
  <path d="M400 404 h40" stroke="#38bdf8" stroke-width="2" marker-end="none"/>
  <path d="M432 398 l10 6 -10 6" fill="#38bdf8"/>

  <!-- Modules -->
  <text x="40" y="468" fill="#64748b" font-family="Inter, Segoe UI, sans-serif" font-size="11" letter-spacing="1.2">MODULES</text>
  <text x="40" y="492" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">Recettes &amp; marges   ·   Production   ·   Stocks &amp; lots   ·   Achats   ·   Livraisons   ·   Devis &amp; facturation</text>
</svg>
