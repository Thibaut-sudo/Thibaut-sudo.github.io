<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" aria-labelledby="bvTitle bvDesc">
  <title id="bvTitle">Fonctionnement de BaladeVélo</title>
  <desc id="bvDesc">Génération de boucles vélo à partir du départ, de la distance, du terrain et du dénivelé, routage OSRM, export GPX.</desc>
  <rect width="840" height="520" rx="24" fill="#0f172a"/>
  <text x="40" y="48" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" letter-spacing="2.2">SCHÉMA FONCTIONNEL</text>
  <text x="40" y="78" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700">BaladeVélo</text>
  <text x="40" y="102" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="13">App mobile Expo — démo sur demande</text>

  <!-- Phone frame, abstract map, not a fake screenshot -->
  <rect x="70" y="140" width="220" height="340" rx="32" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <rect x="150" y="152" width="60" height="8" rx="4" fill="#334155"/>
  <!-- abstract topographic / loop, clearly illustrative -->
  <circle cx="180" cy="310" r="118" fill="#0f172a"/>
  <path d="M120 340 C130 250, 230 230, 250 310 C270 390, 150 410, 130 350 C118 320, 150 300, 190 312 C230 324, 240 280, 200 270"
        fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="340" r="7" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
  <text x="180" y="455" text-anchor="middle" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="11">Boucle générée (illustration)</text>

  <!-- Steps -->
  <g font-family="Inter, Segoe UI, sans-serif">
    <rect x="340" y="150" width="460" height="70" rx="14" fill="#1e293b"/>
    <text x="368" y="180" fill="#38bdf8" font-size="12" font-weight="700">01</text>
    <text x="410" y="180" fill="#f8fafc" font-size="15" font-weight="650">Point de départ</text>
    <text x="410" y="202" fill="#94a3b8" font-size="12">GPS ou recherche d’un lieu</text>

    <rect x="340" y="234" width="460" height="70" rx="14" fill="#1e293b"/>
    <text x="368" y="264" fill="#38bdf8" font-size="12" font-weight="700">02</text>
    <text x="410" y="264" fill="#f8fafc" font-size="15" font-weight="650">Critères de sortie</text>
    <text x="410" y="286" fill="#94a3b8" font-size="12">Distance 5–120 km · route, mixte, gravel, VTT · dénivelé</text>

    <rect x="340" y="318" width="460" height="70" rx="14" fill="#1e293b"/>
    <text x="368" y="348" fill="#38bdf8" font-size="12" font-weight="700">03</text>
    <text x="410" y="348" fill="#f8fafc" font-size="15" font-weight="650">Routage OpenStreetMap</text>
    <text x="410" y="370" fill="#94a3b8" font-size="12">OSRM, sans compte ni clé API</text>

    <rect x="340" y="402" width="460" height="70" rx="14" fill="#1e293b"/>
    <text x="368" y="432" fill="#38bdf8" font-size="12" font-weight="700">04</text>
    <text x="410" y="432" fill="#f8fafc" font-size="15" font-weight="650">Carte, sauvegarde, export</text>
    <text x="410" y="454" fill="#94a3b8" font-size="12">Enregistrement local, GPX, ouverture dans Plans / Google Maps</text>
  </g>
</svg>
